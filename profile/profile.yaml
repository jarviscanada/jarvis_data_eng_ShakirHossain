    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: Complex technical data and system behaviors needed to be clearly communicated and validated across teams.Created data visualizations to synthesize technical information, wrote scripts for stored procedures and triggers, and documented results of software application, information, and telecommunication system tests.Improved clarity of technical insights, ensured reliable database operations, and provided thorough documentation to support system quality and maintenance.Strengthened skills in data visualization, database programming, and technical documentation, and learned the importance of clear communication in system validation and decision-making.
  - title: "Solutions Developer"
    company: "Emera Energy"
    duration: "2021-2025"
    description: The organization relied on legacy on-premise SQL Server infrastructure running on Windows Server 2008 R2, leading to high maintenance overhead and scalability limitations.Designed and executed MSSQL and MySQL migrations from on-premise environments to Azure SQL Services, and built end-to-end proof-of-concept ETL pipelines using Azure Data Factory to validate Azure PaaS solutions against legacy tools like SSIS and linked servers.Successfully decommissioned outdated infrastructure, reduced maintenance costs, and demonstrated the viability and benefits of Azure PaaS-based data integration.Gained deep experience in cloud database migrations and learned how modern PaaS ETL tools can simplify architecture, improve scalability, and replace legacy frameworks effectively.
  - title: "Software Developer"
    company: "LED Roadway LTD"
    duration: "2019-2020"
    description: The company needed an accessible way to monitor the geo-location and performance of streetlamp microsensors in real time.Developed an Android application that integrated sensor performance and location data, and built a geographical user interface using the OpenStreetMap API to display live data feeds and sensor locations.Improved accessibility and visibility of sensor data, enabling users to monitor streetlamp performance and locations efficiently through a mobile interface.Gained experience in mobile app development, real-time data integration, and building map-based user interfaces to enhance usability and operational monitoring.
